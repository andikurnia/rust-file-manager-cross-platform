[package]
name = "finder"
version = "0.1.0"
edition = "2024"
description = "A macOS Finder clone for Linux"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_16"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"] }
gio = "0.22"
glib = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.deb]
name = "finder"
maintainer = "Andhika Kurniawanto <me@andikurnia.com>"
copyright = "2026, Andhika Kurniawanto"
license-file = ["LICENSE", "4"]
depends = "$auto, libgtk-4-1, libadwaita-1-0"
section = "utils"
priority = "optional"
assets = [
    ["target/release/finder", "usr/bin/", "755"],
    ["data/finder.desktop", "usr/share/applications/", "644"],
    ["data/icons/hicolor/scalable/apps/finder.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
